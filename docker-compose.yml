name: rentfind

services:
  db:
    image: postgres:16-alpine
    container_name: rentfind-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - rentfind_pg_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: rentfind-backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - rentfind_media:/app/media
    ports:
      - "19407:8000"

  frontend:
    build: ./frontend
    container_name: rentfind-frontend
    depends_on:
      - backend
    ports:
      - "18407:80"

volumes:
  rentfind_pg_data:
  rentfind_media:
